baseURL = "/"
relativeURLs = true
locale = "en-AU"
title = "asciiam documentation"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term", "RSS"]

[outputs]
home = ["HTML", "JSON"]

[params]
description = "Reference documentation for the asciiam ASCII animation engine."
repositoryURL = "https://gitlab.com/staticcanvas/asciiam"
gitlabURL = "https://gitlab.com/staticcanvas/asciiam"
githubURL = "https://github.com/staticcanvas/asciiam"
editBranch = "main"

[markup]
  [markup.highlight]
  codeFences = true
  guessSyntax = false
  lineNos = false
  noClasses = false
  style = "github-dark"
  [markup.goldmark.renderer]
  unsafe = true

